name: CI — nlpgroup API Server

on:
  push:
    branches: [main, develop]
    paths:
      - "nlpgroup/**"
      - ".github/workflows/nlpgroup-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "nlpgroup/**"

concurrency:
  group: nlpgroup-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: nlpgroup

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: nlpgroup-lint-${{ hashFiles('nlpgroup/requirements.txt', 'nlpgroup/pyproject.toml') }}
      - run: pip install ruff==0.4.4 black==24.4.2 mypy==1.10.0
      - run: ruff check . --output-format=github
      - run: black --check .
      - run: pip install -r requirements.txt && mypy src/ --ignore-missing-imports

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: nlpgroup-test-py${{ matrix.python-version }}-${{ hashFiles('nlpgroup/requirements.txt') }}

      - name: Cài đặt dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Thêm nlp-labs-cl vào PYTHONPATH
        run: echo "PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/nlp-labs-cl" >> $GITHUB_ENV

      - name: Chạy tests (không cần ChromaDB/LLM)
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            -v \
            -m "not integration"
        env:
          DEBUG: "true"
          LLM_PROVIDER: "local"
          CHROMA_HOST: "localhost"
          OPENAI_API_KEY: "sk-test-mock"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: nlpgroup/coverage.xml
          flags: nlpgroup
          fail_ci_if_error: false

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          cd ..
          docker build -f nlpgroup/Dockerfile -t nlpgroup:test . || true
        # Dùng `|| true` vì COPY ../nlp-labs-cl sẽ fail nếu chạy ngoài monorepo context
