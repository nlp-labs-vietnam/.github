[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nlpgroup"
version = "0.1.0"
description = "NLP Labs Vietnam — Solar AI Advisor API (FastAPI + RAG)"
authors = [{ name = "NLP Labs Vietnam", email = "contact@nlpgroup.vn" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["nlp", "vietnamese", "solar", "rag", "fastapi", "llm"]

[project.urls]
Homepage     = "https://nlpgroup.vn"
Repository   = "https://github.com/nlp-labs-vietnam/nlpgroup"
Issues       = "https://github.com/nlp-labs-vietnam/nlpgroup/issues"

# ─── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length    = 100
exclude        = ["dist", "build", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ─── Black ─────────────────────────────────────────────────────────────────────
[tool.black]
line-length    = 100
target-version = ["py310", "py311"]

# ─── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version        = "3.11"
ignore_missing_imports = true
warn_return_any        = true

# ─── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths    = ["tests"]
asyncio_mode = "auto"
addopts      = "-v --tb=short"
markers      = [
    "integration: requires ChromaDB + LLM API",
    "slow: requires model download",
]

# ─── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit   = ["src/rag/_mock_embedder.py", "*/tests/*"]

[tool.coverage.report]
show_missing  = true
fail_under    = 70
