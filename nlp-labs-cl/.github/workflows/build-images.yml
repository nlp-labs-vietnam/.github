name: Build & Publish Docker Images

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:
    inputs:
      image:
        description: "Image cần build (all | run-env-base | build-env-base | dev-env-base)"
        required: false
        default: all
      push:
        description: "Push lên ghcr.io sau khi build?"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/nlp-labs-vietnam/nlp-labs-cl

permissions:
  contents: read
  packages: write

jobs:
  build-matrix:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: run-env-base
            context: docker/run-env-base
            description: "Runtime base image cho NLP inference"
          - image: build-env-base
            context: docker/build-env-base
            description: "Build & CI environment"
          - image: dev-env-base
            context: docker/dev-env-base
            description: "Full developer environment với JupyterLab"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập vào GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trích xuất metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build và Push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.push != 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            PYTHON_VERSION=3.11

      - name: Kiểm tra image với Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0   # Không fail CI khi phát hiện lỗ hổng — chỉ báo cáo

  notify-summary:
    name: Tổng kết build
    runs-on: ubuntu-latest
    needs: build-matrix
    if: always()
    steps:
      - name: In tóm tắt
        run: |
          echo "## 🐳 Docker Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Registry |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| \`run-env-base\` | \`ghcr.io/nlp-labs-vietnam/nlp-labs-cl/run-env-base:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`build-env-base\` | \`ghcr.io/nlp-labs-vietnam/nlp-labs-cl/build-env-base:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`dev-env-base\` | \`ghcr.io/nlp-labs-vietnam/nlp-labs-cl/dev-env-base:latest\` |" >> $GITHUB_STEP_SUMMARY
