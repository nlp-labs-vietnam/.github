[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nlp-labs-cl"
version = "0.1.0"
description = "NLP Labs Vietnam — Core NLP Library (monorepo)"
authors = [{ name = "NLP Labs Vietnam", email = "contact@nlpgroup.vn" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["nlp", "vietnamese", "solar energy", "rag", "transformers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://nlpgroup.vn"
Repository = "https://github.com/nlp-labs-vietnam/nlp-labs-cl"
Issues = "https://github.com/nlp-labs-vietnam/nlp-labs-cl/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*"]

# ─── Ruff linter ──────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["dist", "build", ".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]   # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["modules"]

# ─── Black formatter ──────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py310", "py311"]

# ─── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

# ─── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["modules", "tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "slow: tests yêu cầu download model (chạy với -m slow)",
    "integration: integration tests",
    "gpu: tests yêu cầu GPU",
]

# ─── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["modules"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70
