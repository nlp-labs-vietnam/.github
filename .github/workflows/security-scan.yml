name: Security Scan — Quét bảo mật định kỳ

on:
  schedule:
    - cron: "0 2 * * 1"   # Thứ Hai hàng tuần lúc 02:00 UTC
  push:
    branches: [main]
  workflow_dispatch:       # Cho phép chạy thủ công

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependency-audit:
    name: Kiểm tra lỗ hổng dependencies (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài đặt môi trường NLP
        uses: ./.github/actions/setup-nlp-env
        with:
          python-version: "3.11"

      - name: Quét với pip-audit
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt \
            --format json \
            --output pip-audit-report.json || true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v6
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  codeql-analysis:
    name: CodeQL — Phân tích mã nguồn tĩnh
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@v4

      - name: Khởi tạo CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Tự động build
        uses: github/codeql-action/autobuild@v3

      - name: Chạy phân tích CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  secret-scan:
    name: Quét secret bị lộ trong code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Quét với TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  container-scan:
    name: Quét lỗ hổng Docker image (nếu có Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra có Dockerfile không
        id: check-dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image để scan
        if: steps.check-dockerfile.outputs.exists == 'true'
        run: docker build -t nlp-labs/scan-target:latest .

      - name: Quét với Trivy
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nlp-labs/scan-target:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy kết quả lên GitHub Security
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
