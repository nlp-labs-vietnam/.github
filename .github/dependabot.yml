version: 2

updates:
  # ─── Python (pip) ────────────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"
    reviewers:
      - thekingbao
    groups:
      nlp-core:
        patterns:
          - "langchain*"
          - "openai*"
          - "transformers*"
          - "torch*"
          - "sentence-transformers*"
          - "chromadb*"
          - "faiss-cpu*"
      testing:
        patterns:
          - "pytest*"
          - "coverage*"
          - "mypy*"
          - "ruff*"
          - "black*"

  # ─── Node.js (npm) — dùng cho nlp-ui-kit ─────────────────────────────────────
  - package-ecosystem: npm
    directory: "/nlp-ui-kit"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"
    reviewers:
      - thekingbao
    groups:
      ui-core:
        patterns:
          - "react*"
          - "@types/react*"
          - "tailwindcss*"
          - "class-variance-authority*"
          - "clsx*"
          - "tailwind-merge*"
      build-tools:
        patterns:
          - "vite*"
          - "@vitejs/*"
          - "typescript*"
          - "vite-plugin-dts*"

  # ─── GitHub Actions ───────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
      - ci/cd
    commit-message:
      prefix: "ci(deps)"
    reviewers:
      - thekingbao
